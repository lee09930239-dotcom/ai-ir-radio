<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>法說電台</title>
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-title" content="法說電台">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--mut:#64748b;--card:#fff;--line:#e2e8f0;--acc:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#e2e8f0;--mut:#94a3b8;--card:#1e293b;--line:#334155;--acc:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif;padding:0 16px 40px}
main{max-width:760px;margin:0 auto}
h1{font-size:1.4rem;margin:20px 0 4px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 16px}
h2{font-size:1.05rem;margin:24px 0 8px;padding-top:8px;border-top:1px solid var(--line)}
.co{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.co b{display:block}
.co small{color:var(--mut)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
a.b{font-size:.9rem;border:1px solid var(--line);background:var(--card);color:var(--acc);padding:6px 12px;border-radius:8px;text-decoration:none}
a.pk{display:block;background:var(--acc);color:#fff;text-decoration:none;border-radius:10px;padding:10px 12px;margin-bottom:8px}
a.pk small{display:block;opacity:.85}
.note{font-size:.85rem;color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>法說電台</h1>
<p class="sub">挑好的半導體法說會，點了用 YouTube App 打開，直接從重點開始聽。聽到哪裡由 YouTube 記住。</p>
<h2>精選法說會</h2>
<div id="picks"></div>
<div id="dir"></div>
<p class="note">IR 連結為各公司官方入口，部分需要註冊。</p>
</main>
<script>
// 精選：[公司, 標題, YouTube 連結, 起始秒數, 語言]
const PICKS=[
];
const DATA=[
["設計 / EDA / IP",[
["NVIDIA","GPU、AI 加速器","https://investor.nvidia.com/events-and-presentations/events-and-presentations/default.aspx"],
["AMD","CPU / GPU","https://ir.amd.com/"],
["Broadcom","客製 AI 晶片、網通","https://investors.broadcom.com/"],
["Arm","IP 授權","https://investors.arm.com/"],
["Synopsys","EDA / IP","https://investor.synopsys.com/"],
["Cadence","EDA / IP","https://investor.cadence.com/"]]],
["晶圓代工 / IDM",[
["台積電 TSMC","先進製程代工","https://investor.tsmc.com/chinese"],
["Intel","IDM + 代工","https://www.intc.com/"],
["Samsung Electronics","代工 + 記憶體","https://www.samsung.com/global/ir/"]]],
["製造設備",[
["ASML","EUV 曝光","https://www.asml.com/en/investors"],
["東京威力 Tokyo Electron","塗佈顯影、蝕刻、成膜","https://www.tel.com/ir/"],
["Applied Materials","沉積、蝕刻","https://ir.appliedmaterials.com/"],
["Lam Research","蝕刻、沉積","https://investor.lamresearch.com/"],
["KLA","檢測、量測","https://ir.kla.com/"],
["Lasertec","EUV 光罩檢測","https://www.lasertec.co.jp/en/ir/"],
["DISCO","切割、研磨","https://www.disco.co.jp/eg/ir/"]]],
["檢測 / 測試",[
["愛德萬 Advantest","SoC 測試機","https://www.advantest.com/investors"],
["Teradyne","測試設備","https://investors.teradyne.com/"]]],
["材料 / 耗材",[
["信越化學 Shin-Etsu","矽晶圓、光阻","https://www.shinetsu.co.jp/en/ir/"],
["SUMCO","矽晶圓","https://www.sumcosi.com/english/ir/"],
["聖暉集團","無塵室、特殊氣體與化學品供應系統工程","https://www.acter.com.tw/"]]],
["封裝",[
["日月光 ASE","先進封裝、測試","https://ase.aseglobal.com/ch/investors"],
["Amkor","封測","https://ir.amkor.com/"]]],
["記憶體",[
["SK hynix","HBM","https://www.skhynix.com/eng/ir/"],
["Micron","DRAM / HBM / NAND","https://investors.micron.com/"],
["Kioxia","NAND","https://www.kioxia-holdings.com/en-jp/ir.html"]]]
];

const yt=(u,t)=>{const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return 'https://www.youtube.com/watch?v='+(m?m[1]:'')+(t?'&t='+t+'s':'')};
const mmss=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
function pick(p){
  const [co,title,u,t,lang]=p;
  const a=document.createElement('a');a.className='pk';a.href=yt(u,t);a.target='_blank';a.rel='noopener';
  a.textContent='▶ '+co+'　'+title;
  const s=document.createElement('small');s.textContent=[lang,t?'從 '+mmss(t)+' 開始':''].filter(Boolean).join('・');
  a.append(s);return a;
}
const pk=document.getElementById('picks');
if(PICKS.length)PICKS.forEach(p=>pk.append(pick(p)));
else{const n=document.createElement('p');n.className='note';n.textContent='還沒有精選。在 YouTube 看到想聽的法說會，把連結（和 Q&A 大概幾分開始）貼給 Claude 就會加到這裡。';pk.append(n)}
const dir=document.getElementById('dir');
for(const [t,cs] of DATA){
  const h=document.createElement('h2');h.textContent=t;dir.append(h);
  for(const [n,d,u] of cs){
    const e=document.createElement('div');e.className='co';
    const b=document.createElement('b');b.textContent=n;
    const s=document.createElement('small');s.textContent=d;
    const l=document.createElement('div');l.className='links';
    PICKS.filter(p=>p[0]===n).forEach(p=>e.append(pick(p)));
    const a=document.createElement('a');a.className='b';a.href=u;a.target='_blank';a.rel='noopener';a.textContent='IR 頁面';
    const y=document.createElement('a');y.className='b';y.target='_blank';y.rel='noopener';
    y.href='https://www.youtube.com/results?search_query='+encodeURIComponent(n+' earnings call');y.textContent='YouTube 搜尋';
    l.append(a,y);e.prepend(b,s);e.append(l);dir.append(e);
  }
}
</script>
</body>
</html>
